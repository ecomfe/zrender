<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Animation</title>
    <script src="../dist/zrender.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 5px;
            margin: 0;
        }
        #main0 {
            width: 550px;
            height: 350px;
            border: 2px solid #333;
        }
        #result {
            min-width: 500px;
            height: 300px;
            font-size: 11px;
        }
        .block-title {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
    </style>
</head>
<body>

    <button id="start">Start Test</button>
    <div class="block-title">Canvas:</div>
    <div id="main0"></div>
    <div class="block-title">Console:</div>
    <div>(The following test result is also printed to console.log)</div>
    <textarea id="result"></textarea>

    <script src="./animation-api-cases.js"></script>

    <script type="text/javascript">
        function consoleLog() {
            console.log.apply(console, arguments);
            resultHTMLStr += Array.prototype.join.call(arguments, ' ') + '\n';
            resultPanel.textContent = resultHTMLStr;
        }

        var resultHTMLStr = '';
        var resultPanel = document.getElementById('result');

        var btnStart = document.getElementById('start');
        btnStart.onclick = function () {
            btnStart.disabled = true;

            var domEl = document.getElementById('main0');
            var zr = zrender.init(domEl);

            window.__ZR_ANIMATION_API_TEST_CASES__.runStandalone(
                zrender, zr, consoleLog
            );
        };

    </script>

</body>
</html>
